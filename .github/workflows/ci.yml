name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore
        # Private feed authentication, when needed, must be supplied by the runner.
        run: dotnet restore Hmy.Estao.slnx

      - name: Build
        run: dotnet build Hmy.Estao.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Hmy.Estao.slnx -c Release --no-build --no-restore
