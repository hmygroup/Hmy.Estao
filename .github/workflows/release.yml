name: Release ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 1.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-test-release:
    name: Build, test and release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = 'v${{ inputs.version }}'
          }

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$tag' must use semantic versioning, for example v1.2.0 or v1.2.0-beta.1."
          }

          $version = $Matches.version
          "VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Hmy.Estao.slnx

      - name: Build
        run: dotnet build Hmy.Estao.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests\Hmy.Estao.Tests\Hmy.Estao.Tests.csproj -c Release --no-build --no-restore

      - name: Publish Windows application
        shell: pwsh
        run: |
          dotnet publish src\Hmy.Estao.App\Hmy.Estao.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:VERSION `
            -o artifacts\publish-app

      - name: Publish CLI
        shell: pwsh
        run: |
          dotnet publish src\Hmy.Estao.Cli\Hmy.Estao.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:VERSION `
            -o artifacts\publish-cli

      - name: Create release ZIP
        shell: pwsh
        run: |
          $packageName = "Hmy.Estao-$env:VERSION-win-x64"
          $packageDir = Join-Path 'artifacts' $packageName
          $zipPath = Join-Path 'artifacts' "$packageName.zip"

          New-Item -ItemType Directory -Force -Path "$packageDir\App", "$packageDir\Cli", "$packageDir\Licenses" | Out-Null
          Copy-Item 'artifacts\publish-app\*' "$packageDir\App" -Recurse
          Copy-Item 'artifacts\publish-cli\*' "$packageDir\Cli" -Recurse
          Copy-Item 'README.md' $packageDir
          Copy-Item 'src\Hmy.Estao.App\Assets\ProviderIcons\LICENSE-CodexBar.txt' "$packageDir\Licenses"
          Copy-Item 'src\Zarpa.Controls.Net10\Assets\FluentIcons\LICENSE.txt' "$packageDir\Licenses\LICENSE-FluentSystemIcons.txt"
          Copy-Item 'src\Zarpa.Controls.Net10\Assets\FluentIcons\NOTICE.txt' "$packageDir\Licenses\NOTICE-FluentSystemIcons.txt"
          Set-Content -Path "$packageDir\VERSION.txt" -Value $env:VERSION -Encoding utf8NoBOM

          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -CompressionLevel Optimal
          "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hmy.Estao-${{ steps.metadata.outputs.version }}-win-x64
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:ZIP_PATH --clobber --repo '${{ github.repository }}'
          } else {
            gh release create $env:RELEASE_TAG $env:ZIP_PATH `
              --repo '${{ github.repository }}' `
              --target '${{ github.sha }}' `
              --title "Estao $env:VERSION" `
              --generate-notes
          }
