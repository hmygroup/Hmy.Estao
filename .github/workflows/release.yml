name: Release ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 1.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-test-release:
    name: Build, test and release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$env:INPUT_VERSION"
          }

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$tag' must use semantic versioning, for example v1.2.0 or v1.2.0-beta.1."
          }

          $version = $Matches.version
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $package = $metadata.packages | Where-Object name -eq 'estao'
          if ($package.version -ne $version) {
            throw "Release version $version must match Cargo.toml ($($package.version)); update Cargo.toml and Cargo.lock before tagging."
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build Windows application and CLI
        run: cargo build --locked --release --bin estao --target x86_64-pc-windows-msvc

      - name: Create release ZIP
        shell: pwsh
        run: |
          $packageName = "Hmy.Estao-$env:VERSION-win-x64"
          $packageDir = Join-Path 'artifacts' $packageName
          $zipPath = Join-Path 'artifacts' "$packageName.zip"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item 'target\x86_64-pc-windows-msvc\release\estao.exe' $packageDir
          Copy-Item 'assets' "$packageDir\assets" -Recurse
          Copy-Item 'README.md' $packageDir
          Set-Content -Path "$packageDir\VERSION.txt" -Value $env:VERSION -Encoding utf8NoBOM

          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -CompressionLevel Optimal
          "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hmy.Estao-${{ steps.metadata.outputs.version }}-win-x64
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:ZIP_PATH --clobber --repo '${{ github.repository }}'
          } else {
            gh release create $env:RELEASE_TAG $env:ZIP_PATH `
              --repo '${{ github.repository }}' `
              --target '${{ github.sha }}' `
              --title "Estao $env:VERSION" `
              --generate-notes
          }
