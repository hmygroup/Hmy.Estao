[package]
name = "estao-core"
description = "Estao core: provider usage fetching, configuration, refresh scheduling, secure storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }
