[package]
name = "estao"
description = "Estao: Windows tray usage monitor for AI coding providers (CLI + GPUI app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
estao-core = { path = "../estao-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
gpui-ce = "0.3"
gpui_ce_platform = "0.3.0"
tray-icon = "0.26"
tauri-winrt-notification = "0.8.1"
windows-registry = "0.100.0"
resvg = "0.49.0"
image = { version = "0.25", default-features = false }
serde_json = "1.0.154"
raw-window-handle = "0.6"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }
